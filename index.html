<!DOCTYPE html>
<html lang="en">

<head>
<meta charset="UTF-8">

<meta name="viewport"
content="width=device-width, initial-scale=1.0">

<title>AVF Simulator</title>

<style>

/* =========================
   PAGE
========================= */

body {
    font-family: Arial, Helvetica, sans-serif;
    background: #f4f7fb;
    margin: 0;
    padding: 30px;
    text-align: center;
    color: #1f2937;
}

.container {
    max-width: 800px;
    margin: auto;
    background: white;
    padding: 35px;
    border-radius: 20px;

    box-shadow:
    0 5px 20px rgba(0,0,0,0.10);
}


/* =========================
   HEADER
========================= */

h1 {
    font-size: 34px;
    margin-top: 0;
    margin-bottom: 5px;
}

.subtitle {
    font-size: 16px;
    color: #64748b;
    margin-bottom: 35px;
}

h2 {
    font-size: 22px;
    margin-top: 30px;
    margin-bottom: 20px;
}


/* =========================
   VITAL SIGNS
========================= */

.vitals {

    display: flex;

    justify-content: center;

    gap: 20px;

    margin-bottom: 35px;
}


.vital-box {

    background: #eef4ff;

    padding: 25px;

    border-radius: 15px;

    width: 240px;
}


/* หัวข้อใหญ่ + ตัวหนา */

.vital-title {

    font-size: 24px;

    font-weight: bold;

    margin-bottom: 15px;
}


/* ค่าด้านล่างเล็กกว่า + ตัวปกติ */

.vital-value {

    font-size: 18px;

    font-weight: normal;
}


/* =========================
   AUDIO OUTPUT
========================= */

.output-box {

    background: #f8fafc;

    padding: 22px;

    border-radius: 15px;

    margin-bottom: 35px;

    border: 1px solid #e2e8f0;
}


.output-box h2 {

    margin-top: 0;
}


.output-buttons {

    display: flex;

    justify-content: center;

    gap: 12px;
}


.output-buttons button {

    background: #475569;
}


#outputStatus {

    margin-top: 15px;

    font-size: 14px;

    color: #64748b;
}


/* =========================
   AVF CONDITION BUTTONS
========================= */

.buttons {

    display: grid;

    grid-template-columns: 1fr 1fr;

    gap: 12px;
}


button {

    padding: 17px;

    border: none;

    border-radius: 12px;

    font-size: 16px;

    cursor: pointer;

    background: #2563eb;

    color: white;

    transition: 0.2s;
}


button:hover {

    opacity: 0.85;

    transform: translateY(-1px);
}


/* ปุ่มที่กำลังเล่น */

button.active {

    background: #0f172a;
}


/* =========================
   STOP BUTTON
========================= */

.stop {

    background: #dc2626;

    margin-top: 15px;

    width: 100%;

    font-weight: bold;
}


/* =========================
   VOLUME
========================= */

.volume-box {

    margin-top: 30px;
}


.volume-box h3 {

    margin-bottom: 15px;
}


input[type="range"] {

    width: 80%;

    max-width: 500px;
}


/* =========================
   STATUS
========================= */

#status {

    margin-top: 22px;

    padding: 12px;

    background: #f8fafc;

    border-radius: 10px;

    font-size: 15px;

    font-weight: bold;

    color: #334155;
}


/* =========================
   MOBILE
========================= */

@media (max-width: 600px) {

    body {

        padding: 12px;
    }


    .container {

        padding: 20px;
    }


    h1 {

        font-size: 28px;
    }


    .vitals {

        flex-direction: column;

        align-items: center;
    }


    .vital-box {

        width: 85%;
    }


    .buttons {

        grid-template-columns: 1fr;
    }


    .output-buttons {

        flex-direction: column;
    }


    input[type="range"] {

        width: 100%;
    }
}

</style>

</head>


<body>


<div class="container">


<!-- =========================
     HEADER
========================= -->

<h1>
AVF Simulator
</h1>


<div class="subtitle">

Arteriovenous Fistula Training System

</div>



<!-- =========================
     VITAL SIGNS
========================= -->

<h2>
Patient Vital Signs
</h2>


<div class="vitals">


<div class="vital-box">

<div class="vital-title">

HEART RATE

</div>


<div class="vital-value">

<span id="hr">
72
</span>

BPM

</div>

</div>



<div class="vital-box">

<div class="vital-title">

BLOOD PRESSURE

</div>


<div class="vital-value">

<span id="bp">
120/80
</span>

mmHg

</div>

</div>


</div>



<!-- =========================
     AUDIO OUTPUT
========================= -->

<div class="output-box">


<h2>
Audio Output
</h2>


<div class="output-buttons">


<button onclick="useCurrentOutput()">

This Device

</button>


<button onclick="selectExternalSpeaker()">

Select External Speaker

</button>


</div>


<div id="outputStatus">

Output: Default Device

</div>


</div>



<!-- =========================
     AVF SOUNDS
========================= -->

<h2>

Select AVF Condition

</h2>


<div class="buttons">


<button
onclick="playSound(
'Successful AVF.mp3',
'Successful AVF',
this
)">

Successful AVF

</button>



<button
onclick="playSound(
'AVF with Stenosis.mp3',
'AVF with Stenosis',
this
)">

AVF with Stenosis

</button>



<button
onclick="playSound(
'AVF with Aneurysm.mp3',
'AVF with Aneurysm',
this
)">

AVF with Aneurysm

</button>



<button
onclick="playSound(
'Non-functioning AVF.mp3',
'Non-functioning AVF',
this
)">

Non-functioning AVF

</button>



<button
onclick="playSound(
'AVF Doppler bubble signal(phantom).mp3',
'Doppler Bubble Signal',
this
)">

Doppler Bubble Signal

</button>



<button
onclick="playSound(
'turbulent_blood_flow_bruit.mp3',
'Turbulent Blood Flow Bruit',
this
)">

Turbulent Blood Flow Bruit

</button>


</div>



<!-- =========================
     STOP
========================= -->

<button
class="stop"
onclick="stopSound()">

STOP

</button>



<!-- =========================
     VOLUME
========================= -->

<div class="volume-box">


<h3>
Volume
</h3>


<input
type="range"
min="0"
max="1"
step="0.01"
value="0.7"
oninput="changeVolume(this.value)"
>


</div>



<!-- =========================
     STATUS
========================= -->

<div id="status">

Ready

</div>



<!-- AUDIO PLAYER -->

<audio
id="audioPlayer"
preload="auto">
</audio>


</div>



<script>


/* =========================
   VARIABLES
========================= */

const player =
document.getElementById("audioPlayer");


const statusText =
document.getElementById("status");


const outputStatus =
document.getElementById("outputStatus");


player.volume = 0.7;



/* =========================
   REMOVE ACTIVE BUTTON
========================= */

function clearActiveButtons() {

    const buttons =
    document.querySelectorAll(".buttons button");


    buttons.forEach(function(button) {

        button.classList.remove("active");

    });

}



/* =========================
   PLAY SOUND
========================= */

function playSound(
file,
condition,
button
) {


    player.pause();


    player.currentTime = 0;


    clearActiveButtons();


    if (button) {

        button.classList.add("active");

    }


    player.src =
    encodeURI(file);


    player.load();


    player.play()

    .then(function() {


        statusText.innerText =
        "Playing: " + condition;


    })

    .catch(function(error) {


        statusText.innerText =
        "Cannot play audio";


        console.error(
        "Audio error:",
        error
        );


    });

}



/* =========================
   STOP SOUND
========================= */

function stopSound() {


    player.pause();


    player.currentTime = 0;


    clearActiveButtons();


    statusText.innerText =
    "Stopped";

}



/* =========================
   VOLUME
========================= */

function changeVolume(value) {


    player.volume =
    Number(value);

}



/* =========================
   EXTERNAL SPEAKER
========================= */

async function selectExternalSpeaker() {


    try {


        if (

            navigator.mediaDevices &&

            "selectAudioOutput"
            in navigator.mediaDevices &&

            typeof player.setSinkId
            === "function"

        ) {


            const device =

            await navigator.mediaDevices
            .selectAudioOutput();



            await player.setSinkId(
            device.deviceId
            );



            outputStatus.innerText =

            "Output: " +

            (
                device.label ||
                "External Speaker"
            );


        }


        else {


            alert(

            "This browser cannot select an audio output directly. " +

            "Please connect your Bluetooth speaker in your device settings " +

            "and select it as the audio output."

            );


        }


    }


    catch(error) {


        console.error(error);


        outputStatus.innerText =
        "Output selection cancelled";


    }

}



/* =========================
   DEFAULT OUTPUT
========================= */

async function useCurrentOutput() {


    try {


        if (

            typeof player.setSinkId
            === "function"

        ) {


            await player.setSinkId("");


        }


        outputStatus.innerText =
        "Output: Default Device";


    }


    catch(error) {


        console.error(error);


    }

}



/* =========================
   WHEN AUDIO FINISHES
========================= */

player.addEventListener(
"ended",
function() {


    clearActiveButtons();


    statusText.innerText =
    "Ready";


});



/* =========================
   AUDIO ERROR
========================= */

player.addEventListener(
"error",
function() {


    clearActiveButtons();


    statusText.innerText =
    "Audio file could not be loaded";


});


</script>


</body>

</html>
